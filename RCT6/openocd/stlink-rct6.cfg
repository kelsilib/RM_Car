# RCT6的ST-Link/SWD连接设置。这里只描述连接方法，不包含擦除或下载命令。
# CubeIDE把OpenOCD程序和配置文件放在不同目录，使用时必须带正确的-s目录。
# 本机ST版OpenOCD使用新的ST-Link驱动；旧HLA模板会在读取配置时反复调用自己。
# 适用ST-Link V2（固件J24及以上）和V3；具体下载器仍要接上后检测。
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

# 先用1MHz连接，方便第一次排查接线。这个速度不是主控运行时钟。
set CLOCK_FREQ 1000
source [find target/stm32f1x.cfg]

# 不依赖下载器的NRST线。BOOT0仍需在实物上保持从Flash启动的低电平。
reset_config none
bindto 127.0.0.1
